[variables]
COMPOSER_ALLOW_SUPERUSER = "1"
NIXPACKS_PHP_VERSION = "8.3"

[phases.setup]
nixPkgs = [
    "php83",
    "php83Packages.composer",
    "nodejs_20"
]

[phases.build]
cmds = [
    "mkdir -p /app/node_modules/.cache",
    "npm install",
    "composer install --optimize-autoloader --no-dev --no-scripts --no-interaction --ignore-platform-reqs"
]
